name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm audit --omit=dev
      - run: npm run build
        env:
          WORDPRESS_URL: http://127.0.0.1:9/cms
          WORDPRESS_SERVICE_TOKEN: ci-build-token
          ROBOTS_INDEXING: "false"
      - run: php -l wordpress/glr-cms/glr-cms.php
      - run: php wordpress/tests/contracts.php
